name: Release skill package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist build/gaoxiang-di4ban-jiaocai
          rsync -a --exclude ".git" --exclude ".github" \
            --exclude "dist" --exclude "build" ./ build/gaoxiang-di4ban-jiaocai/
          (cd build && zip -qr "../dist/gaoxiang-di4ban-jiaocai-${VERSION}.zip" gaoxiang-di4ban-jiaocai)
          cp "dist/gaoxiang-di4ban-jiaocai-${VERSION}.zip" \
             "dist/gaoxiang-di4ban-jiaocai-${VERSION}.skill"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
